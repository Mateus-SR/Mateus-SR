name: Update Profile Visuals

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Mateus-SR
          cards: overview,lifetime,repositories
          output-dir: assets
          themes: light,dark
          palette: blue
          mono-font: Roboto Mono
          commit: false
      - name: Apply the custom 8-Bit Ocean palette
        run: python scripts/apply-profile-palette.py
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overview.dark.svg assets/overview.light.svg assets/lifetime.dark.svg assets/lifetime.light.svg assets/repositories.dark.svg assets/repositories.light.svg
          git diff --cached --quiet || (git commit -m "chore(profile): refresh themed profile cards [skip ci]" && git push)
