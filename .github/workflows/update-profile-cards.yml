name: Update Profile Cards

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Mateus-SR
          cards: overview,lifetime,repositories
          output-dir: assets
          themes: light,dark
          palette: blue
          mono-font: Roboto Mono
          commit: true
          commit-message: "chore(profile): refresh overview, lifetime and repositories cards [skip ci]"
